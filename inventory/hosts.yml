# Публичный шаблон inventory (Ansible-стиль).
# Реальные хосты — в hosts.local.yml (gitignore) или правьте только локально.
# Документация: docs/ops/servers.md

all:
  vars:
    ssh_user: root
    ssh_key: "~/.ssh/xeno_ed25519"
    domain: "example.com"
    ru_domain: "entry.example.com"
    nl_domain: "exit.example.com"
    # Reality SNI-донор (TLS 1.3); подбирайте под свою сеть
    reality_sni: "www.example.com"
    reality_dest: "www.example.com:443"
    relay_port: 8443
    client_port: 443
    timezone: "UTC"
    xray_version: "latest"

  hosts:
    nl-exit:
      ansible_host: "203.0.113.10"
      role: exit
      location: nl
      mode: coexist

    ru-bridge:
      ansible_host: "203.0.113.20"
      role: relay
      location: ru
      profile_name: "XENO RU"
      mode: clean

    yc-whitelist:
      ansible_host: ""
      role: relay
      location: yc
      profile_name: "YC Whitelist"
      mode: deferred
